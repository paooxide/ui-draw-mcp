name: Release

# Tag-driven. workflow_dispatch builds the archives without publishing, so the
# packaging can be exercised before committing to a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others; the release job checks
      # what actually arrived.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Cross-compiled on the arm64 runner: Apple's toolchain links both.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml produces archives whose names do
      # not match what binstall will look for, and a changelog entry for a
      # version nobody can install.
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p agentctl --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          name="agentctl-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/agentctl.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/agentctl" "dist/$name/"
          fi
          cp LICENSE README.md CHANGELOG.md config.example.toml "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      # The changelog section for this tag becomes the release body, so the
      # notes cannot drift from the file.
      - name: Extract the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $version." > notes.md
          fi

      # Draft, not published: the binaries are unsigned, and a matrix leg may
      # have failed without failing this job. A human checks the asset list.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body_path: notes.md
          fail_on_unmatched_files: true
