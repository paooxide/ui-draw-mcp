name: Release

# Tag-driven. workflow_dispatch builds the archives without publishing, so the
# packaging can be exercised before committing to a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others; the release job checks
      # what actually arrived.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the arm64 runner: Apple's toolchain links both.
          - os: macos-latest
            target: x86_64-apple-darwin
          # Linux links against an old glibc through cargo-zigbuild. A plain
          # build links against the runner's (2.39 on ubuntu-24.04), and the
          # binary then refuses to start on Ubuntu 22.04, Debian 12 or RHEL 9.
          # 2.28 is RHEL 8 and Debian 10; the smoke test runs it on AlmaLinux 8.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            glibc: "2.28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            glibc: "2.28"
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with Cargo.toml produces archives whose names do
      # not match what binstall will look for, and a changelog entry for a
      # version nobody can install.
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        if: matrix.glibc
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: matrix.glibc
        with:
          tool: cargo-zigbuild

      - name: Build
        if: ${{ !matrix.glibc }}
        run: cargo build --release --locked -p agentctl --target ${{ matrix.target }}

      # The `.2.28` suffix picks the glibc to link against; the output still
      # lands in target/<target>/release.
      - name: Build (glibc ${{ matrix.glibc }})
        if: matrix.glibc
        run: cargo zigbuild --release --locked -p agentctl --target ${{ matrix.target }}.${{ matrix.glibc }}

      # Both checks, because each misses something: the symbol scan does not
      # prove the binary loads, and one old distro does not prove the floor.
      - name: Runs on glibc ${{ matrix.glibc }}
        if: matrix.glibc
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/agentctl"
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol: $newest"
          if [ "$(printf '%s\n%s\n' "$newest" "${{ matrix.glibc }}" | sort -V | tail -1)" != "${{ matrix.glibc }}" ]; then
            echo "binary needs glibc $newest, more than the ${{ matrix.glibc }} floor" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/$bin:/agentctl:ro" almalinux:8 /agentctl --version

      - name: Runs
        if: ${{ !matrix.glibc && matrix.target == 'aarch64-apple-darwin' }}
        run: target/${{ matrix.target }}/release/agentctl --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          name="agentctl-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/agentctl" "dist/$name/"
          cp LICENSE README.md CHANGELOG.md config.example.toml "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The changelog section for this tag becomes the release body, so the
      # notes cannot drift from the file.
      - name: Extract the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $version." > notes.md
          fi

      # Draft, not published: the binaries are unsigned, and a matrix leg may
      # have failed without failing this job. A human checks the asset list.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          body_path: notes.md
          fail_on_unmatched_files: true
