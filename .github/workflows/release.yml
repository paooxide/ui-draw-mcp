name: Release

# Tag-driven. workflow_dispatch builds the archives without publishing, so the
# packaging can be exercised before committing to a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Secrets cannot appear in a step's `if`, so their presence is read here.
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
    strategy:
      # One platform failing should not hide the others; the release job checks
      # what actually arrived.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the arm64 runner: Apple's toolchain links both.
          - os: macos-latest
            target: x86_64-apple-darwin
          # Linux links against an old glibc through cargo-zigbuild. A plain
          # build links against the runner's (2.39 on ubuntu-24.04), and the
          # binary then refuses to start on Ubuntu 22.04, Debian 12 or RHEL 9.
          # 2.28 is RHEL 8 and Debian 10; the smoke test runs it on AlmaLinux 8.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            glibc: "2.28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            glibc: "2.28"
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with Cargo.toml produces archives whose names do
      # not match what binstall will look for, and a changelog entry for a
      # version nobody can install.
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        if: matrix.glibc
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: matrix.glibc
        with:
          tool: cargo-zigbuild

      - name: Build
        if: ${{ !matrix.glibc }}
        run: cargo build --release --locked -p agentctl --target ${{ matrix.target }}

      # The `.2.28` suffix picks the glibc to link against; the output still
      # lands in target/<target>/release.
      - name: Build (glibc ${{ matrix.glibc }})
        if: matrix.glibc
        run: cargo zigbuild --release --locked -p agentctl --target ${{ matrix.target }}.${{ matrix.glibc }}

      # Both checks, because each misses something: the symbol scan does not
      # prove the binary loads, and one old distro does not prove the floor.
      - name: Runs on glibc ${{ matrix.glibc }}
        if: matrix.glibc
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/agentctl"
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol: $newest"
          if [ "$(printf '%s\n%s\n' "$newest" "${{ matrix.glibc }}" | sort -V | tail -1)" != "${{ matrix.glibc }}" ]; then
            echo "binary needs glibc $newest, more than the ${{ matrix.glibc }} floor" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/$bin:/agentctl:ro" almalinux:8 /agentctl --version

      - name: Runs
        if: ${{ !matrix.glibc && matrix.target == 'aarch64-apple-darwin' }}
        run: target/${{ matrix.target }}/release/agentctl --version

      # Developer ID signing and notarization. Off until the secrets exist: it
      # needs a "Developer ID Application" certificate (paid Apple Developer
      # Program), which an "Apple Development" certificate cannot stand in for.
      # Secrets: APPLE_DEVELOPER_ID_P12 (base64 .p12), APPLE_DEVELOPER_ID_P12_PASSWORD,
      # APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      # APPLE_NOTARY_KEY (base64 App Store Connect .p8), APPLE_NOTARY_KEY_ID,
      # APPLE_NOTARY_ISSUER.
      - name: Sign and notarize (macOS)
        if: ${{ runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/agentctl"
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 16)
          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          # Hardened runtime and a secure timestamp are what notarization requires.
          codesign --force --options runtime --timestamp --keychain "$kc" \
            --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          # A bare Mach-O cannot be stapled; Gatekeeper looks the ticket up online.
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/agentctl.zip"
          xcrun notarytool submit "$RUNNER_TEMP/agentctl.zip" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$kc"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          name="agentctl-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/agentctl" "dist/$name/"
          cp LICENSE README.md CHANGELOG.md config.example.toml "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    # Build provenance is signed keylessly through Sigstore with this job's
    # GitHub OIDC identity; no key to hold or leak.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance for every archive: proves it was built by this
      # workflow, from this tag, in this repository. Verify with
      #   gh attestation verify <archive> -R ${{ github.repository }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      # The changelog section for this tag becomes the release body, so the
      # notes cannot drift from the file.
      - name: Extract the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $version." > notes.md
          fi

      # Draft, not published: a matrix leg may have failed without failing this
      # job, and without Developer ID secrets the macOS binaries are not
      # notarized. A human checks the asset list before publishing.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          body_path: notes.md
          fail_on_unmatched_files: true
