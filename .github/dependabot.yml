version: 2
updates:
  # Rust dependencies across the workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor bumps, so review stays light.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The actions pinned in the CI and release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
