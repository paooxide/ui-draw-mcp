<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whiteboard fixture</title>
<!--
  A drawing-tool page for browser_act's pointer tests (whiteboard_live.rs).
  Nothing is loaded from the network.

  - #board is a <canvas> whose bitmap (300x200) is CSS-scaled 2x (600x400)
    behind a 4px border, so CSS offsets and bitmap pixels differ. It records
    every pointerdown/move/up (buttons, modifier flags, bitmap coordinates)
    and every modifier keydown/keyup into window.__events, draws strokes while
    a button is held (window.__strokes), and closes a polygon on dblclick from
    the clicks before it (window.__polygons).
  - #svg has a rect with a draggable corner handle (#v) that resizes it.
  The page fits headless Chrome's default 756x469 viewport.
  - The canvas's wheel listener records ctrlKey (window.__wheel).
-->
<style>
  body { margin: 0; font: 12px monospace; }
  .a { position: absolute; }
  #board { left: 10px; top: 10px; width: 600px; height: 400px; border: 4px solid #333; background: #fff; touch-action: none; }
  #svg { left: 622px; top: 10px; background: #eef; }
  #log { left: 10px; top: 430px; width: 780px; height: 150px; overflow: hidden; white-space: pre-wrap; color: #555; }
</style>
</head>
<body>
<canvas id="board" class="a" width="300" height="200"></canvas>
<svg id="svg" class="a" width="130" height="200">
  <rect id="rect" x="10" y="20" width="60" height="60" fill="#9cf" stroke="#36c"></rect>
  <circle id="v" cx="70" cy="80" r="8" fill="#c33" style="cursor:move"></circle>
</svg>
<div id="log" class="a"></div>
<script>
(function(){
  var board = document.getElementById('board');
  var ctx = board.getContext('2d');
  var events = window.__events = [];
  var strokes = window.__strokes = [];
  var polygons = window.__polygons = [];
  var pending = window.__pending = [];
  var wheel = window.__wheel = [];
  var log = document.getElementById('log');

  function note(e){
    events.push(e);
    log.textContent = events.length + ' events; last ' + JSON.stringify(e);
  }
  // Bitmap pixel under a pointer event: CSS offset inside the content box,
  // scaled by bitmap/client size.
  function px(e){
    var r = board.getBoundingClientRect();
    var sx = board.width / board.clientWidth, sy = board.height / board.clientHeight;
    return {
      x: Math.round((e.clientX - r.left - board.clientLeft) * sx * 100) / 100,
      y: Math.round((e.clientY - r.top - board.clientTop) * sy * 100) / 100
    };
  }
  function record(type, e){
    var p = px(e);
    note({type: type, x: p.x, y: p.y, buttons: e.buttons, button: e.button,
      shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey});
    return p;
  }

  var stroke = null;
  board.addEventListener('pointerdown', function(e){
    var p = record('pointerdown', e);
    stroke = [[p.x, p.y]];
    ctx.beginPath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = e.shiftKey ? '#c33' : '#36c';
    ctx.moveTo(p.x, p.y);
  });
  board.addEventListener('pointermove', function(e){
    var p = record('pointermove', e);
    if(stroke && e.buttons){
      stroke.push([p.x, p.y]);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  });
  board.addEventListener('pointerup', function(e){
    var p = record('pointerup', e);
    if(stroke){
      stroke.push([p.x, p.y]);
      strokes.push(stroke);
      stroke = null;
    }
  });

  // Polygon tool: each click adds a vertex (a repeat of the last is the
  // double click's own clicks, not a vertex); dblclick closes the polygon.
  board.addEventListener('click', function(e){
    var p = px(e), last = pending[pending.length - 1];
    if(last && Math.abs(last[0] - p.x) < 2 && Math.abs(last[1] - p.y) < 2) return;
    pending.push([p.x, p.y]);
  });
  board.addEventListener('dblclick', function(){
    if(pending.length < 3) return;
    polygons.push(pending.slice());
    ctx.beginPath();
    ctx.moveTo(pending[0][0], pending[0][1]);
    for(var i = 1; i < pending.length; i++) ctx.lineTo(pending[i][0], pending[i][1]);
    ctx.closePath();
    ctx.strokeStyle = '#393';
    ctx.stroke();
    pending.length = 0;
  });

  board.addEventListener('wheel', function(e){
    e.preventDefault();
    wheel.push({dx: e.deltaX, dy: e.deltaY, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey});
    note({type: 'wheel', ctrl: e.ctrlKey, dy: e.deltaY});
  }, {passive: false});

  // Modifier keys a tool listens for itself (shift to constrain, ctrl to
  // zoom), in the same list as the pointer events so their order shows.
  var mods = {Shift: 1, Control: 1, Alt: 1, Meta: 1};
  document.addEventListener('keydown', function(e){ if(mods[e.key]) note({type: 'keydown', key: e.key, repeat: e.repeat}); });
  document.addEventListener('keyup', function(e){ if(mods[e.key]) note({type: 'keyup', key: e.key}); });

  // A draggable rect vertex: the handle moves and the rect follows it.
  var svg = document.getElementById('svg'), rect = document.getElementById('rect'), v = document.getElementById('v');
  var grab = null;
  window.__vertex = {moves: 0, down: 0, up: 0};
  v.addEventListener('pointerdown', function(e){
    var r = svg.getBoundingClientRect();
    grab = {dx: e.clientX - r.left - (+v.getAttribute('cx')), dy: e.clientY - r.top - (+v.getAttribute('cy'))};
    window.__vertex.down++;
    v.setPointerCapture(e.pointerId);
  });
  v.addEventListener('pointermove', function(e){
    if(!grab || !e.buttons) return;
    var r = svg.getBoundingClientRect();
    var cx = e.clientX - r.left - grab.dx, cy = e.clientY - r.top - grab.dy;
    var x = +rect.getAttribute('x'), y = +rect.getAttribute('y');
    v.setAttribute('cx', cx); v.setAttribute('cy', cy);
    rect.setAttribute('width', Math.max(1, cx - x));
    rect.setAttribute('height', Math.max(1, cy - y));
    window.__vertex.moves++;
  });
  v.addEventListener('pointerup', function(){ grab = null; window.__vertex.up++; });
})();
</script>
</body>
</html>
