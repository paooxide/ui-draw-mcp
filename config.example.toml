# agentctl configuration.
#
# Copy to ~/.agentctl/config.toml (or point $AGENTCTL_CONFIG at it).
#
# EVERY engine is closed by default. With no roots / commands / hosts / services
# listed here, those engines refuse everything rather than falling open. A file
# that exists but fails to parse aborts startup: silently reverting to defaults
# could *widen* a policy stricter than the built-in one.

[policy]
# The quick way: one permission profile instead of listing categories and
# dangerous tools by hand. Uncomment ONE, and the two settings below it
# (categories, enable) are ignored.
#   access = "ask"     every capability on; read and act freely, but a
#                      dangerous tool or a destructive action asks you (dialog).
#   access = "auto"    every capability on; nothing prompts, but a clearly
#                      destructive action is refused rather than done blind.
#   access = "bypass"  every capability on; nothing prompts; the destructive
#                      gate is off. Only the kill switch and reaching for the
#                      mouse can stop it. Your explicit "I take responsibility".
# access = "ask"

# The granular way (used only when `access` is not set). Only these categories
# are advertised and callable.
#   vision input window browser system terminal filesystem network credentials
#   memory desktop packages
categories = ["vision", "input", "window", "browser", "system"]

# Dangerous-tier tools must be named here to be callable at all. This is the
# operator's pre-approval; in interactive mode a human is *also* asked per call.
enable = []

# interactive = ask a human (a native dialog on macOS, zenity on Linux) before risky actions.
# autonomous  = nobody to ask, so anything needing consent is denied.
# dry_run     = rehearsal. Read-tier tools run for real; anything that would
#               change something reports what it *would* have done, including
#               whether it would have asked you, and does not do it. The gate
#               still refuses what it would normally refuse, so this is how you
#               find out what an agent's prompt will actually try, against the
#               real config and the real tool list, with nothing at risk.
mode = "interactive"

# Cap on how often one session may interrupt a human. Past this, further
# requests are denied without prompting: unlimited dialogs train people to
# click Allow (consent fatigue).
max_consent_prompts = 20

# Session aborts after this many denials (anti-spin).
max_denials = 5

# GUI apps the agent may launch or drive.
allowed_apps = ["TextEdit", "Finder"]

# PII/PHI tokenizer. When on, tool results reach the model with names you
# registered, SSNs, Luhn-valid card numbers, emails, phone numbers, MRNs, IPv4
# addresses and API keys replaced by tokens such as <SSN_1>. The plaintext is
# restored only when the model types a token into a local field
# (keyboard_type, set_value, ui_fill_form, browser_fill_form, browser_act); a
# token in any other tool's arguments (a URL, a command, a file) is refused,
# because restoring it there would send the real value off the machine.
# It does not stop the model typing a token into a field on a page it chose,
# or into a terminal. Off by default: it also rewrites IP addresses and
# phone-like numbers in network and system output. AGENTCTL_ANONYMIZE=1 or 0
# overrides this.
anonymize = false

# Audit log signing. Every tool call is appended to ~/.agentctl/audit as a
# SHA-256 hash chain signed with Ed25519. Unset, each session signs with a
# throwaway key and records that key in the log, so `agentctl audit verify`
# can only say the log is self-consistent: anyone able to rewrite the file can
# re-sign it. Create a key once with `agentctl audit keygen`, point this at it
# (the file must be mode 0600), and verify with --pubkey <the printed key>.
# audit_signing_key = "/Users/you/.agentctl/audit_signing.key"

# Demo mode, for screencasts. The pointer glides along an eased curve instead
# of jumping, and browser pages get a visible pointer, click ripples and a
# typing overlay (secret fields masked). On Chrome the page also sees the
# pointer arrive (real mousemove events, so :hover styles apply). It slows
# every pointer action and adds elements to pages, so leave it off for real
# work and in CI.
# --demo / --demo-speed and AGENTCTL_DEMO / AGENTCTL_DEMO_SPEED override these.
demo = false
# cinematic (350 ms), demo (200 ms), snappy (100 ms), or instant (alias: off).
# Anything else here, or in AGENTCTL_DEMO_SPEED, is a startup error.
demo_speed = "demo"

# Role profiles narrow what a session may call; they never widen it. Built in:
# readonly (read tier only), qa (browser, vision, window, system, input; no
# browser_eval), browser (browser tools only, for web QA and demos),
# browser-core (the 12 browser tools a page task needs, for the smallest tool
# list), operator (dangerous tools always ask), admin (no extra limits). Roles also filter the
# advertised tool list, so `role = "browser"` is how to show only browser tools
# when `access` is set (access turns every category on).
# Pick one for this server, or define your own below.
# role = "qa"

# Paths and domains refused in any tool's arguments before the gate, whatever
# `access` says. This is a check on argument text: it sees "/etc/shadow" inside
# a command and resolves symlinks, but not a relative path, a shell glob or
# what a host name resolves to. The filesystem jail, the command allowlist and
# the SSRF guard remain the real limits. Defaults cover /etc/shadow,
# /etc/sudoers, /etc/pam.d, /System and master.passwd.
# [invariants]
# protected_paths = ["/etc/shadow", "/etc/sudoers", "/Users/you/.ssh"]
# denied_domains = ["pastebin.com", "transfer.sh"]

# A custom role, selected with role = "support" above.
# [roles.support]
# description = "Reads and browses; may not touch the terminal or files"
# allowed_categories = ["browser", "vision", "window", "system"]
# denied_tools = ["browser_eval", "browser_cookies"]
# require_consent_for = ["standard"]   # tiers or tool names
# max_denials = 3                      # can only tighten policy.max_denials

[input]
# Stop when a human takes over the mouse.
#
# Reaching for the mouse is the reflex people already have for interrupting
# something; this makes that gesture stop the agent, without needing to
# remember a key combination or find the STOP file. While agentctl is driving,
# it compares where the pointer *is* against where it *put* it; a sustained
# divergence trips the kill switch, cancels any drag in progress, and posts a
# notification saying how to resume.
#
# Keyboard has no equivalent signal and is deliberately not covered: detecting
# human typing would mean watching every keystroke on the machine.
human_override = "true"
# How far the pointer must be from anywhere agentctl put it, in points. Small
# values trip on ordinary coordinate jitter.
human_override_px = 12
# How long after an action agentctl still counts as driving, so a divergence
# between two calls is not missed.
human_override_grace_ms = 1500
# Apps whose typed input is screened for destructive shell commands.
# Editors are included by default because their *integrated terminals* run the
# same shell: the accessibility API cannot tell an editor pane from a terminal
# pane, so the whole app is screened. Over-triggering on a source file that
# merely contains "rm -rf" is the safe direction to be wrong in: it asks, it
# does not refuse. Setting this replaces the default list.
# terminal_apps = ["Terminal", "iTerm", "Code", "Zed", "Cursor"]

[fs]
# Directories the filesystem engine may touch. Paths are fully resolved and
# checked against these roots, so `..` and symlinks cannot escape.
# Credential stores (~/.ssh, keychains, .netrc, ...) are denied even inside a root.
# `browser_upload` (dangerous tier, so it also needs `policy.enable`) attaches only files inside
# these roots, through the same jail; with no roots it refuses. A page can read what is attached.
roots = []

[terminal]
# Binaries `exec` may run, matched on basename.
allowed_commands = []
# Allow `shell: true` on exec, AND `pty_spawn` at all. One switch, because a PTY
# is a real shell: gating `exec --shell` while leaving PTYs open would be theatre.
allow_shell = "false"
# Shells `pty_spawn` may start, by absolute path.
allowed_shells = ["/bin/zsh", "/bin/bash", "/bin/sh"]
# Concurrent PTY sessions, and how much output each one buffers before the
# oldest is dropped (the tail is kept: the end answers the question).
max_pty_sessions = 4
max_pty_buffer = 262144

[network]
# Hosts `http_request` may reach. A leading dot matches subdomains:
#   ".example.com" matches example.com and api.example.com
allowed_hosts = []
# Permit private/loopback/link-local targets. Off by default: this is what
# blocks cloud metadata (169.254.169.254) and internal admin panels.
allow_private = "false"

[credentials]
# Keychain services the agent may touch. Secret values are NEVER returned to
# the agent regardless of this setting; there is no plaintext read.
allowed_services = []

[packages]
# Package managers the install/uninstall engine may use. Empty = it refuses
# everything. This is the most dangerous category in the product: an install is
# arbitrary code execution plus persistence.
allowed_sources = []
# Permit installing from a URL, local file or third-party tap. Off by default:
# that path is indistinguishable from malware delivery.
allow_arbitrary_source = "false"
# If non-empty, only these package ids may be installed.
allowlist = []
denylist = []
# A protected set (this agent, the package manager, security tooling) can never
# be uninstalled and is deliberately not configurable.

[memory]
# Where recorded sequences live, and how many are kept. Off unless the `memory`
# category is enabled.
# store = "~/.agentctl/memory.json"
max_recipes = 500

[browser]
# Origins `browser_navigate` may go to, as `scheme://host[:port][/path-prefix]`.
# Matching is on the parsed origin, so "https://ok.example" does not admit
# "https://ok.example.evil". Empty = any public origin. Only http, https and
# about:blank are ever accepted: file:, data: and javascript: bypass controls
# that exist elsewhere.
allowed_origins = []
# Whatever the allowlist says, the address a name resolves to is checked, and
# loopback, private and link-local targets (cloud metadata lives at
# 169.254.169.254) are refused. Turn this on to drive a local development
# server. It does not bypass `allowed_origins`.
allow_private = false

[vision]
# Screen-capture cost/legibility trade-offs. These are not security controls:
# they decide how much of your image budget a capture spends. Image cost tracks
# *pixel area*, not file size, so shrinking the longest edge is the only thing
# that actually reduces spend; compressing harder does not.

# Longest delivered edge for each `detail` tier, in pixels (160-4096).
detail_low_px = 768         # layout/state checks: "did the dialog appear?"
detail_balanced_px = 1024   # most interactions
detail_full_px = 1568       # small text stays legible

# The tier used when a call names neither `detail` nor `max_edge`. Lower this to
# make every capture cheaper without touching a single call site.
default_detail = "full"

# Pixels per image token, for the cost estimate reported alongside each capture.
pixels_per_token = 750

# Two consecutive frames whose mean absolute difference (0-255) is below this
# count as visually identical, and the second is reported as `unchanged` instead
# of being re-sent: a polling loop otherwise re-sends the same megabyte every
# iteration. Measured idle noise on real hardware is ~0.002, so the default sits
# far above the noise floor while still catching any change worth acting on.
# Raise it to dedup more aggressively; set 0 to disable dedup entirely.
unchanged_mad = 1.0

# Soft advisory cap: a larger capture is still returned, but flagged so the
# agent knows to capture a region instead.
max_image_bytes = 8000000

[judge]
# A System One model (TypeSafe's jev) consulted for the semantic residue of a
# decision: which of forty buttons is the one that saves, whether page text is
# addressed to the model, whether a typed line would destroy data when the
# pattern list did not match. Off by default. When on, a judgment can only
# tighten a decision (a denial, a consent prompt, a warning) or rank
# candidates for the agent; nothing it says can loosen one, and when it is
# unreachable the server proceeds on the deterministic answer alone.
#
# What it sends leaves the machine: element names, window titles, page text
# after redaction, typed commands. Never a secure field's value.
enabled = "false"
# The key is read from TYPESAFE_API_KEY, then ./.env, then
# ~/.agentctl/typesafe.key (chmod 600). Never from this file, never from argv.
base_url = "https://api.typesafe.ai"
model = "jev-latest"
timeout_ms = 4000
# A yes-probability at or above this counts as yes wherever yes tightens. It
# is the fallback for the three per-use bars below, each of which is best set
# from your own representative cases rather than left at a guess.
threshold = 0.7
# Optional per-use overrides of `threshold`. Leave a line out to inherit it.
#
#   destructive_threshold: the bar for the second opinion on a typed command.
#     A yes escalates it to consent or a denial, so a LOWER value is more
#     cautious. Set it below `threshold` when a missed destructive command
#     costs more than an extra consent prompt.
#   injection_threshold: the bar for flagging that an untrusted result is
#     addressed to the model (prompt injection).
#   match_threshold: the bar a ranking's `any_fits` must clear for a semantic
#     pick (an element, a dialog button, a recalled recipe) to count as a real
#     match rather than the least-bad of poor options.
#
# destructive_threshold = 0.5
# injection_threshold = 0.7
# match_threshold = 0.6
# Largest state sent with one question, in bytes; text beyond it is cut.
max_state_bytes = 48000

[http]
# Optional HTTP transport. OFF by default, and stdio remains the primary
# transport: over stdio the client *is* the parent process, so the OS does the
# authentication for you. A listening socket has to earn that back, which is
# what everything below is for.
enabled = "false"

# Listen address. Loopback only: the transport refuses to bind anything else,
# because it speaks plaintext and would otherwise put the bearer token on the
# wire on every request.
bind = "127.0.0.1:8765"

# Bearer token, required on every request. Leave empty and one is generated per
# run and printed to stderr; set it here to keep a stable token across restarts.
# There is no anonymous mode and no short-token mode.
token = ""

# Browser origins allowed to call the endpoint, matched exactly. Empty (the
# default) means any request carrying an `Origin` header is refused.
#
# This is not CORS pedantry. Any web page can make your browser POST to
# 127.0.0.1, so a local port is not a private one; a real MCP client sends no
# Origin header at all. Only set this if you are deliberately fronting the
# server with a local web UI.
allowed_origins = []
