[workspace]
resolver = "2"
members = [
    "crates/mcp-types",
    "crates/mcp-policy",
    "crates/mcp-core",
    "crates/mcp-a11y",
    "crates/mcp-vision",
    "crates/mcp-input",
    "crates/mcp-window",
    "crates/mcp-browser",
    "crates/mcp-fs",
    "crates/mcp-proc",
    "crates/mcp-ssrf",
    "crates/mcp-judge",
    "crates/mcp-net",
    "crates/mcp-sys",
    "crates/mcp-sec",
    "crates/mcp-desktop",
    "crates/mcp-memory",
    "crates/mcp-pty",
    "crates/mcp-pkg",
    "crates/mcp-macos",
    "crates/mcp-linux",
    "crates/test-support",
    "agentctl",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/paooxide/ui-draw-mcp"
description = "MCP server giving an AI agent grounded control of a real computer: GUI, browser and system."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
toml = "0.8"
regex = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
hex = "0.4"

# --- SSD-conscious build profiles ---------------------------------------------
# Skip debuginfo entirely: it is usually the majority of target/ size and we have
# little disk. Re-enable per-package when you actually need to debug.
[profile.dev]
debug = 0

# Release builds are what people download, so they are optimised and stripped.
#
# `panic` stays "unwind" deliberately. Teardown in this workspace is Drop-based:
# PtySession kills its child process group, and CdpBackend stops the browsers it
# launched and removes their temporary profiles. `panic = "abort"` skips
# destructors, so a panic would leak a shell or a browser — exactly the class of
# bug the shutdown work exists to fix.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0

[profile.dev.package."*"]
opt-level = 0
debug = 0
