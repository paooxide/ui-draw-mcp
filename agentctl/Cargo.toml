[package]
name = "agentctl"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# cargo-binstall: fetch the release archive instead of compiling. The template
# must match the asset names produced by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "agentctl"
path = "src/main.rs"

[dependencies]
mcp-types = { path = "../crates/mcp-types" }
mcp-policy = { path = "../crates/mcp-policy" }
mcp-core = { path = "../crates/mcp-core" }
mcp-a11y = { path = "../crates/mcp-a11y" }
mcp-input = { path = "../crates/mcp-input" }
# Browser/CDP engine is OS-independent (talks CDP over TCP) — always wired in.
mcp-browser = { path = "../crates/mcp-browser" }
# Commodity engines — all OS-independent, wired on every platform.
mcp-fs = { path = "../crates/mcp-fs" }
mcp-proc = { path = "../crates/mcp-proc" }
mcp-net = { path = "../crates/mcp-net" }
mcp-sys = { path = "../crates/mcp-sys" }
mcp-sec = { path = "../crates/mcp-sec" }
mcp-pty = { path = "../crates/mcp-pty" }
mcp-pkg = { path = "../crates/mcp-pkg" }
mcp-memory = { path = "../crates/mcp-memory" }
mcp-window = { path = "../crates/mcp-window" }
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[dev-dependencies]
test-support = { path = "../crates/test-support" }
mcp-browser = { path = "../crates/mcp-browser" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
mcp-macos = { path = "../crates/mcp-macos" }
mcp-input = { path = "../crates/mcp-input" }
# Used only by the human-override live test, to move the pointer the way a
# person does: from outside agentctl, so it is never recorded as ours.
core-graphics = "0.24"

# Real macOS backend (AXUIElement) — only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
mcp-macos = { path = "../crates/mcp-macos" }
mcp-window = { path = "../crates/mcp-window" }
mcp-vision = { path = "../crates/mcp-vision" }
# Desktop session/power control is macOS-only for now (no Windows/Linux backend).
mcp-desktop = { path = "../crates/mcp-desktop" }
