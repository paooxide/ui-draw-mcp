[package]
name = "mcp-proc"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
# Installed from git, never from crates.io.
publish = false

[dependencies]
mcp-types = { path = "../mcp-types" }
mcp-policy = { path = "../mcp-policy" }
# Shares the terminal category; `man_page` renders through the
# same overstrike/ANSI stripper a PTY needs, and one copy is better than two.
mcp-pty = { path = "../mcp-pty" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "process", "time", "io-util"] }
