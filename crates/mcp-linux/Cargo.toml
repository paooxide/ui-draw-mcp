[package]
name = "mcp-linux"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
# Installed from git, never from crates.io.
publish = false
description = "The Linux desktop backend: AT-SPI perception, portal input, portal capture, D-Bus session control."

[dependencies]
mcp-types = { path = "../mcp-types" }
mcp-a11y = { path = "../mcp-a11y" }
mcp-input = { path = "../mcp-input" }
mcp-window = { path = "../mcp-window" }
mcp-vision = { path = "../mcp-vision" }
mcp-desktop = { path = "../mcp-desktop" }
async-trait.workspace = true
tracing.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "process", "fs", "sync"] }

# The desktop stack only exists on Linux. On other targets this crate is empty,
# mirroring `mcp-macos`, so the workspace builds everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30.0", features = ["tokio"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
enumflags2 = "0.7"
wl-clipboard-rs = "0.9.3"
notify-rust = { version = "4.17.0", default-features = false, features = ["z"] }
xkeysym = "0.2.1"
png = "0.18.1"
base64 = "0.23.1"
ocrs = "0.13.1"
rten = "0.26"
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
