[package]
name = "mcp-input"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
# Installed from git, never from crates.io.
publish = false

[dependencies]
mcp-types = { path = "../mcp-types" }
mcp-a11y = { path = "../mcp-a11y" }
# For the shared wait evaluator: an `expect` clause and `wait_for` must not be
# two different opinions about when the UI has settled.
mcp-window = { path = "../mcp-window" }
# Pure `is_destructive` helper only — not the policy gate (which runs in mcp-core).
mcp-policy = { path = "../mcp-policy" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
