[package]
name = "mcp-browser"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
# Installed from git, never from crates.io.
publish = false

[dependencies]
mcp-types = { path = "../mcp-types" }
mcp-ssrf = { path = "../mcp-ssrf" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# `net` is not in the workspace tokio feature set; the browser engine needs it
# to talk CDP over TCP. Cargo unions features across the workspace.
tokio = { workspace = true, features = ["net", "io-util", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }
