[package]
name = "mcp-browser"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
# Installed from git, never from crates.io.
publish = false

[dependencies]
mcp-types = { path = "../mcp-types" }
mcp-ssrf = { path = "../mcp-ssrf" }
mcp-judge = { path = "../mcp-judge" }
# The coordinate-grid drawer shared with the desktop captures, and the
# pure-Rust OCR engine `browser_screenshot ocr/find` reads canvases with.
mcp-vision = { path = "../mcp-vision", features = ["ocr"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# `net` is not in the workspace tokio feature set; the browser engine needs it
# to talk CDP over TCP. Cargo unions features across the workspace.
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "fs", "process", "sync"] }

[dev-dependencies]
# Decode the screenshot a live test gets back, to look at its pixels.
png = "0.18.1"
base64 = "0.23.1"
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }
