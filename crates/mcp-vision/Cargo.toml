[package]
name = "mcp-vision"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
# Installed from git, never from crates.io.
publish = false

[dependencies]
mcp-types = { path = "../mcp-types" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# PNG decode/encode for the coordinate grid. Pure Rust, and already in the tree
# through mcp-linux.
png = "0.18.1"
base64 = "0.23.1"
# The pure-Rust OCR engine (CPU, no system framework), behind `ocr`. Its two
# models are fetched on first use; see `ocr::Ocr`.
ocrs = { version = "0.13.1", optional = true }
rten = { version = "0.26", optional = true }

[features]
ocr = ["dep:ocrs", "dep:rten"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
